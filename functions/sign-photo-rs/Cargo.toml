[package]
name = "handler"
version = "0.1.0"
edition = "2021"
rust-version = "1.83"

[lib]
name = "handler"
path = "main.rs"

[dependencies]
# `add_thumbnails` is deliberately NOT enabled: c2pa embeds a full-quality copy
# of the asset as a manifest thumbnail when it is on, which took a 59KB photo to
# 590KB in the Node prototype. Off is both smaller to build and smaller to store.
c2pa = "0.90"
openruntimes = { version = "1.0.2", package = "openruntimes-types-for-rust" }
serde_json = "1.0"
base64 = "0.22"
# Only for stamping the publication date; a client-supplied date would be a
# claim the signature then vouches for, so it is generated here instead.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

# The `appwrite` crate is deliberately not used: every published version pins
# `fastrand = "=2.0.2"`, which can never coexist with the `tempfile 3.27` that
# c2pa requires. We need exactly one endpoint — a multipart file upload — so a
# direct HTTP call costs less than the SDK anyway.
#
# rustls rather than native-tls so the build needs no OpenSSL headers, and
# blocking rather than async because the runtime hands us a synchronous handler.
[dependencies.reqwest]
version = "0.12"
default-features = false
features = ["blocking", "multipart", "json", "rustls-tls"]
